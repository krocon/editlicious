# CI for editlicious (taken over from comic-commander-tauri).
# Frontend checks on Linux; Rust fmt/clippy/test on Linux, macOS and Windows – the
# `#[cfg(target_os = …)]` code (platform code, menus) is only compiled on its own OS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (format, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm site:test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.label }})
    strategy:
      fail-fast: false # see every platform's errors, not only the first
      matrix:
        include:
          # the whole workspace, app included
          - { label: macos, os: macos-latest, scope: --workspace, apt: false, optional: false }
          - { label: windows, os: windows-latest, scope: --workspace, apt: false, optional: false }
          # Linux, required: the engine crates need no GTK/WebKit – no apt, cannot hang on a mirror
          - label: linux engine
            os: ubuntu-24.04
            scope: -p ed-core -p ed-video -p ed-mcp
            apt: false
            optional: false
          # Linux, optional: the app with GTK/WebKit from apt. GitHub's Linux runners downloaded
          # packages extremely slowly on 26.10.2026 (28 min and more); this job may fail without
          # turning CI red. The release workflow builds the Linux app in full anyway.
          - { label: linux app, os: ubuntu-24.04, scope: --workspace, apt: true, optional: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 45 # a hanging runner fails instead of blocking for 6 h
    steps:
      - uses: actions/checkout@v5
      # Downloaded .debs are kept in the GitHub cache: the Azure mirror is sometimes very slow
      # (28 min on 26.10.2026). Only what the build needs – no recommended extras (GStreamer …).
      - name: Cache of Linux packages
        if: matrix.apt
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ matrix.os }}-
      - name: Linux system dependencies
        if: matrix.apt
        timeout-minutes: 15 # normally ~1 min; a stuck mirror fails instead of hanging ("Re-run failed jobs")
        run: |
          mkdir -p ~/apt-cache/partial
          # GitHub's Azure mirror was very slow on 26.10.2026: use the Ubuntu archive instead
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-cache"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
          sudo chown -R "$USER" ~/apt-cache
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Debug builds compile in Tauri's dev mode (devUrl), so no frontend build is needed here.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml ${{ matrix.scope }} --all-targets --locked -- -D warnings
      # Failing tests also become one error annotation (the "failures:" block of the log), so
      # they show up in the PR without opening the job log.
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --manifest-path src-tauri/Cargo.toml ${{ matrix.scope }} --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            log="$RUNNER_TEMP/test.log"
            # names first (the last "failures:" list), then the details, cut to fit an annotation
            names=$(awk '/^failures:$/{n=""} /^    [^ ]/{n=n $0 "\n"} END{printf "%s", n}' "$log")
            details=$(sed -n '/^failures:$/,/^test result:/p' "$log" | head -c 30000)
            msg=$(printf 'Failed tests:\n%b\n%s' "$names" "$details")
            [ -z "$details" ] && msg=$(tail -n 60 "$log")
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=cargo test (${{ matrix.label }})::$msg"
            exit 1
          fi
