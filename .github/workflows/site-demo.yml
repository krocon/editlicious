# Builds the live demo of the website (prompt 011): the engine ed-core as WebAssembly.
# The result (site/demo/pkg) is committed back to main when it changed (and uploaded as the artifact
# "demo-pkg") – the website stays plain files without a build step. Pushes made with GITHUB_TOKEN
# start no further workflow runs.
name: Site demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/core/**'
      - 'src-tauri/wasm/**'
      - 'scripts/site-demo.sh'
      - '.github/workflows/site-demo.yml'

permissions:
  contents: write

concurrency:
  group: site-demo
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: Engine → WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/wasm
      - name: Tests of the bindings (native)
        run: cargo test --locked --manifest-path src-tauri/wasm/Cargo.toml
      - name: wasm-bindgen in the version of the lock file
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' src-tauri/wasm/Cargo.lock)
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - run: bash scripts/site-demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: demo-pkg
          path: site/demo/pkg
          if-no-files-found: error
      - name: Commit the new build
        if: github.ref == 'refs/heads/main'
        run: |
          git add site/demo/pkg
          if git diff --cached --quiet; then
            echo "demo unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(site): build of the live demo engine" -m "Built by the Site demo workflow from ${GITHUB_SHA}."
          git pull --rebase origin main
          git push origin HEAD:main
