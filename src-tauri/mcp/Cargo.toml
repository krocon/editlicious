[package]
name = "ed-mcp"
version = "0.1.0"
description = "MCP server of editlicious (stdio sidecar): lets an AI drive the running editor"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/editlicious"
edition = "2024"
rust-version = "1.93"

[lib]
name = "ed_mcp"
path = "src/lib.rs"

[[bin]]
name = "editlicious-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
