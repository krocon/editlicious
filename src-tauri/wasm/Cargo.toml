[package]
name = "ed-wasm"
version = "0.1.0"
description = "The editlicious engine (ed-core) in the browser – the live demo of the website"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/editlicious"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# the pure-Rust regex engine for the grammars (Oniguruma is C and does not build for wasm32)
ed-core = { path = "../core", default-features = false, features = ["fancy"] }
wasm-bindgen = "0.2"
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
