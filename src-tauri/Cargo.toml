[workspace]
members = ["core", "mcp", "video"]
# the WebAssembly build of the engine for the website demo (prompt 011) – own lock file, built with
# `pnpm site:demo`; outside the workspace so `ed-core` keeps Oniguruma for the app
exclude = ["wasm"]

[package]
name = "editlicious"
version = "1.0.0"
description = "A calm text editor for huge files (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/editlicious"
edition = "2024"
rust-version = "1.93"

[lib]
name = "ed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
# design 012 E3: a second start ("open with" on Windows/Linux) hands its files to the running app
tauri-plugin-single-instance = "2"
# design 002 E12: the editor engine (document, editing, frames) – Tauri-free
ed-core = { path = "core" }
# design 016 E1: bridge messages and the endpoint file shared with the MCP sidecar
ed-mcp = { path = "mcp" }
# design 017: video export (`editlicious render …`)
ed-video = { path = "video" }
# design 003 E5: copy/cut/paste in Rust – big selections never cross the IPC bridge
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"
