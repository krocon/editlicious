PackageIdentifier: MarcKronberg.editlicious
PackageVersion: 1.2.0
MinimumOSVersion: 10.0.0.0
ReleaseDate: 2026-11-11
Installers:
  # NSIS (Tauri), per-user install without admin rights. Silent switch /S is the NSIS default.
  # The hook windows/open-with.nsh only adds "Open with" entries under HKCU, no default association.
  # ProductCode left out on purpose: Tauri's NSIS template registers the uninstall entry under
  # HKCU\...\Uninstall\editlicious – confirm in the validation result before adding "ProductCode: editlicious".
  - Architecture: x64
    InstallerType: nullsoft
    Scope: user
    InstallerUrl: https://github.com/krocon/editlicious/releases/download/v1.2.0/editlicious_1.2.0_x64-setup.exe
    InstallerSha256: 3CF1795E3B0ABD622C932079D755162241C574D3C387AA1246C885F9FBAF7EA5
    UpgradeBehavior: install
    AppsAndFeaturesEntries:
      - DisplayName: editlicious
        Publisher: Marc Kronberg
  # WiX MSI (Tauri), per machine (ALLUSERS=1). Codes read from the MSI Property table of the release file.
  - Architecture: x64
    InstallerType: wix
    Scope: machine
    InstallerUrl: https://github.com/krocon/editlicious/releases/download/v1.2.0/editlicious_1.2.0_x64_en-US.msi
    InstallerSha256: DC3EA0FB6A800C22E6E6D1960C2E9E0D3793E4A3D1CF40435F581F27B6E34982
    ProductCode: '{B7A8AEC5-99A4-4CAF-BB97-540CA0612F39}'
