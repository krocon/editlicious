ShortDescription: Calm, keyboard-first text editor for huge files
Description: |-
  editlicious is a calm, keyboard-first text editor that opens and edits huge files – millions of lines, lines with
  millions of characters, files up to 4 GB. The text lives in a rope inside a Rust engine and the window only renders
  what you see. Several carets, column selection, find and replace with regular expressions, syntax colours for more
  than 70 languages, encodings and line endings kept on save, atomic saving. No telemetry. Free and open source (MIT).
