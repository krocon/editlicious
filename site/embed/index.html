<!doctype html>
<!--
  Test and example page of the embeddable editor (prompt 025): <editlicious-editor> elements
  side by side – A and B with built-in schemes, C coloured only by the page's variables (026). Plain HTML, no framework. `pnpm build:element` puts the element into
  lib/ (not committed); serve the site folder over http (ES modules and WebAssembly).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>editlicious – embedded</title>
    <script type="module" src="lib/editlicious-editor.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --page-bg: #fbfaf7;
        --page-text: #1d2026;
        --page-muted: #6b6f78;
        --page-line: #ddd9cf;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #121418;
          --page-text: #e4e5e8;
          --page-muted: #969ba5;
          --page-line: #2c3038;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        font: 15px/1.5 system-ui, sans-serif;
        color: var(--page-text);
        background: var(--page-bg);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      p {
        margin: 0 0 12px;
        color: var(--page-muted);
      }
      .pair {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      editlicious-editor {
        height: 360px;
        border: 1px solid var(--page-line);
        border-radius: 8px;
      }
      button,
      label {
        font: inherit;
      }
      /* markers of the page (prompt 029): a class of its own gets its colour here */
      #c {
        --ed-mark-running: var(--app-keyword);
      }
      /* the page styles the kinds of its suggestions (prompt 028) */
      #c::part(icon-table) {
        color: var(--app-bg);
        background: var(--app-type);
      }
      #c::part(icon-column) {
        color: var(--app-bg);
        background: var(--app-string);
      }
      #c::part(icon-function) {
        color: var(--app-bg);
        background: var(--app-function);
      }
      /* C has no built-in scheme: the page maps its own theme variables onto the editor's
         (prompt 026); the buttons switch the page theme on <html>, the editor follows at once */
      :root {
        --app-bg: #fdf6e3;
        --app-text: #586e75;
        --app-accent: #268bd2;
        --app-keyword: #859900;
        --app-string: #2aa198;
        --app-number: #d33682;
        --app-comment: #93a1a1;
        --app-function: #268bd2;
        --app-type: #b58900;
      }
      :root[data-app-theme='dusk'] {
        --app-bg: #002b36;
        --app-text: #93a1a1;
        --app-accent: #b58900;
        --app-keyword: #cb4b16;
        --app-string: #2aa198;
        --app-number: #d33682;
        --app-comment: #586e75;
        --app-function: #6c71c4;
        --app-type: #b58900;
      }
      #c {
        --ed-bg: var(--app-bg);
        --ed-text: var(--app-text);
        --ed-caret: var(--app-accent);
        --color-accent: var(--app-accent);
        --color-accent-text: var(--app-bg);
        --syn-keyword: var(--app-keyword);
        --syn-string: var(--app-string);
        --syn-number: var(--app-number);
        --syn-constant: var(--app-number);
        --syn-comment: var(--app-comment);
        --syn-function: var(--app-function);
        --syn-type: var(--app-type);
      }
      #log {
        height: 140px;
        margin: 16px 0 0;
        padding: 8px;
        overflow: auto;
        font: 12px/1.4 ui-monospace, monospace;
        border: 1px solid var(--page-line);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>&lt;editlicious-editor&gt;</h1>
    <p>Two independent editors on one page, one shared engine (WebAssembly in a worker).</p>
    <div class="pair">
      <figure>
        <figcaption>
          <strong>A</strong> Rust · paper
          <label><input type="checkbox" data-ro="a" /> read-only</label>
          <button type="button" data-million="a">1 million lines</button>
          <button type="button" data-long="a">5 million characters in one line</button>
        </figcaption>
        <editlicious-editor id="a" language="Rust" scheme="paper" status-bar></editlicious-editor>
      </figure>
      <figure>
        <figcaption>
          <strong>B</strong> TypeScript · night
          <label><input type="checkbox" data-ro="b" /> read-only</label>
          <button type="button" data-million="b">1 million lines</button>
          <button type="button" data-get="b">getValue()</button>
          <button type="button" data-play="b">playScript()</button>
        </figcaption>
        <editlicious-editor
          id="b"
          language="TypeScript"
          scheme="night"
          word-wrap
          tab-width="2"
        ></editlicious-editor>
      </figure>
      <figure>
        <figcaption>
          <strong>C</strong> SQL · scheme="none", colours from the page
          <button type="button" data-app-theme="">page theme: day</button>
          <button type="button" data-app-theme="dusk">page theme: dusk</button>
          <label><input type="checkbox" id="slow" /> provider takes 2 s</label>
          <button type="button" id="snippet">insertSnippet()</button>
          <button type="button" id="lint">setMarkers()</button>
          <button type="button" id="unlint">clearMarkers('lint')</button>
          <button type="button" id="many">100 000 markers</button>
        </figcaption>
        <editlicious-editor id="c" language="SQL" scheme="none" color-scheme="light" status-bar></editlicious-editor>
      </figure>
    </div>
    <pre id="log" aria-live="polite"></pre>
    <script type="module">
      const a = document.getElementById('a');
      const b = document.getElementById('b');
      // properties work before and after the element is defined
      a.value = 'fn main() {\n    let x = 255 / 8;\n    println!("{x} #3f7fdf");\n}\n';
      b.value = "import { Component } from '@angular/core';\n\nexport class Demo {\n  ngOnInit() {}\n}\n";
      const c = document.getElementById('c');
      c.value = "-- orders of the last week\nSELECT o.id, c.name, SUM(o.total) AS total\nFROM orders o\nJOIN customers c ON c.id = o.customer_id\nWHERE o.created > NOW() - INTERVAL '7 days'\nGROUP BY o.id, c.name;\n";
      for (const btn of document.querySelectorAll('[data-app-theme]')) {
        btn.addEventListener('click', () => {
          const t = btn.dataset.appTheme;
          if (t) document.documentElement.dataset.appTheme = t;
          else delete document.documentElement.dataset.appTheme;
          c.colorScheme = t ? 'dark' : 'light';
        });
      }
      // Suggestions from the page (prompt 028): 50 000 entries – tables, columns, functions.
      // Ctrl+Space asks, typing asks from two characters, a dot asks for columns.
      const ENTRIES = [];
      for (let t = 0; t < 2500; t++) {
        const table = `${['orders', 'customers', 'invoices', 'products', 'events'][t % 5]}_${String(t).padStart(4, '0')}`;
        ENTRIES.push({ label: table, kind: 'table', detail: 'public', documentation: `Table public.${table}` });
        for (let k = 0; k < 19; k++) {
          ENTRIES.push({ label: `${table}.col_${k}`, kind: 'column', detail: k % 2 ? 'text' : 'bigint', filterText: `col_${k} ${table}` });
        }
      }
      for (const f of ['NOW', 'COUNT', 'COALESCE', 'SUM', 'LOWER', 'UPPER']) {
        ENTRIES.push({ label: f, insertText: f + '($1)$0', snippet: true, kind: 'function', detail: 'function', sortText: '!' + f });
      }
      const slow = document.getElementById('slow');
      const provider = async (ctx) => {
        if (slow.checked) await new Promise((r) => setTimeout(r, 2000));
        if (ctx.signal.aborted) return null;
        write(`c provider asked: ${ctx.trigger} "${ctx.word}" at ${ctx.position.line}:${ctx.position.ch}`);
        return ENTRIES;
      };
      provider.triggerCharacters = ['.'];
      c.completionProvider = provider;
      c.wordSuggest = true;
      // Snippets (prompt 030): `sel` + Tab, or from the list
      c.snippets = [
        { prefix: 'sel', body: 'SELECT ${1:*} FROM ${2:table} WHERE ${3:1=1};$0', description: 'select statement' },
        { prefix: 'ins', body: ['INSERT INTO ${1:table} (${2:columns})', 'VALUES (${3:values});$0'], description: 'insert' },
      ];
      document.getElementById('snippet').addEventListener('click', async () => {
        await c.insertSnippet('-- ${1:note} ($DATE, $WHO)\n$0', { vars: { WHO: 'the page' } });
        c.focus();
      });
      // Markers (prompt 029): two owners – a "linter" that underlines every `*` and number, and
      // the statement that "runs" (a class of the page with a tinted background and a symbol).
      const lint = async () => {
        const text = await c.getValue();
        const markers = [];
        text.split('\n').forEach((line, i) => {
          for (const m of line.matchAll(/\*|\b\d+\b|\bNOW\b/g)) {
            const ch = [...line.slice(0, m.index)].length + 1;
            markers.push({
              start: { line: i + 1, ch },
              end: { line: i + 1, ch: ch + [...m[0]].length },
              severity: m[0] === '*' ? 'warning' : m[0] === 'NOW' ? 'hint' : 'error',
              message: m[0] === '*' ? 'Name the columns instead of *.' : `"${m[0]}" – says the page's linter.`,
              gutter: m[0] === '*',
              onEdit: 'remove',
            });
          }
        });
        await c.setMarkers('lint', markers);
        await c.setMarkers('running', [
          { start: { line: 2, ch: 1 }, end: { line: 4, ch: 1 }, severity: 'running', message: 'This statement is running.', gutter: '▶', lineBackground: true },
        ]);
        write(`c ${markers.length} lint markers, 1 running`);
      };
      document.getElementById('lint').addEventListener('click', lint);
      document.getElementById('unlint').addEventListener('click', () => c.clearMarkers('lint'));
      document.getElementById('many').addEventListener('click', async () => {
        const lines = new Array(1_000_000);
        for (let i = 0; i < lines.length; i++) lines[i] = `SELECT col_${i % 50} FROM table_${i}`;
        await c.setValue(lines.join('\n'));
        const markers = [];
        for (let i = 0; i < 100_000; i++) {
          markers.push({ start: { line: i * 10 + 1, ch: 8 }, end: { line: i * 10 + 1, ch: 13 }, severity: i % 3 ? 'warning' : 'error', message: `marker ${i}` });
        }
        const t0 = performance.now();
        await c.setMarkers('many', markers);
        write(`c 100 000 markers in 1 000 000 lines set in ${Math.round(performance.now() - t0)} ms`);
      });
      c.addEventListener('ed-marker-click', (e) => write(`c marker click ${JSON.stringify(e.detail)}`));
      const log = document.getElementById('log');
      const write = (line) => {
        log.textContent += line + '\n';
        log.scrollTop = log.scrollHeight;
      };
      for (const el of [a, b, c]) {
        el.addEventListener('ed-ready', () => write(`${el.id} ready`));
        el.addEventListener('ed-change', (e) => write(`${el.id} change ${JSON.stringify(e.detail)}`));
        el.addEventListener('ed-caret', (e) => write(`${el.id} caret ${JSON.stringify(e.detail)}`));
      }
      for (const box of document.querySelectorAll('[data-ro]')) {
        box.addEventListener('change', () => {
          document.getElementById(box.dataset.ro).readOnly = box.checked;
        });
      }
      const million = () => {
        const lines = new Array(1_000_000);
        for (let i = 0; i < lines.length; i++) lines[i] = `line ${i + 1}: the quick brown fox ${i % 97}`;
        return lines.join('\n');
      };
      for (const btn of document.querySelectorAll('[data-million]')) {
        btn.addEventListener('click', async () => {
          const t0 = performance.now();
          await document.getElementById(btn.dataset.million).setValue(million());
          write(`${btn.dataset.million} 1 000 000 lines in ${Math.round(performance.now() - t0)} ms`);
        });
      }
      for (const btn of document.querySelectorAll('[data-long]')) {
        btn.addEventListener('click', async () => {
          const t0 = performance.now();
          await document.getElementById(btn.dataset.long).setValue('x'.repeat(5_000_000) + '\n');
          write(`${btn.dataset.long} 5 000 000 characters in ${Math.round(performance.now() - t0)} ms`);
        });
      }
      for (const btn of document.querySelectorAll('[data-get]')) {
        btn.addEventListener('click', async () => {
          const text = await document.getElementById(btn.dataset.get).getValue();
          write(`${btn.dataset.get} getValue(): ${text.length} characters`);
        });
      }
      const script = [
        'tempo human cpm=480 seed=7',
        'move docEnd',
        'type "\\nexport const greet = (name: string) => `Hello ${name}!`;\\n"',
        'pause 400',
        'find "Demo"',
        'type "Showcase"',
      ].join('\n');
      for (const btn of document.querySelectorAll('[data-play]')) {
        btn.addEventListener('click', async () => {
          const t0 = performance.now();
          await document.getElementById(btn.dataset.play).playScript(script);
          write(`${btn.dataset.play} playScript() done in ${Math.round(performance.now() - t0)} ms`);
        });
      }
    </script>
  </body>
</html>
